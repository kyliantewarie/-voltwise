name: Git Manager weekly check

on:
  schedule:
    - cron: '17 3 * * 1'   # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manager-${{ github.repository }}
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Security and supply-chain scan
        run: python tools/manager_check.py
      - name: Install dev toolchain
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Lint and static security
        run: |
          python -m ruff check voltwise tests audit
          python -m mypy voltwise --ignore-missing-imports
          python -m bandit -q -r voltwise -s B104
      - name: Tests and project audit
        run: |
          python -m pytest -q
          python audit/run_audits.py
